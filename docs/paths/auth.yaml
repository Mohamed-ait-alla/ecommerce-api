/api/v1/auth/register:
  post:
    summary: Register a new user
    tags: [Auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password, firstname, lastname]
            properties:
              email:
                type: string
                format: email
                example: user@example.com
              password:
                type: string
                format: password
                example: StrongPassword123!
              firstname:
                type: string
                example: John
              lastname:
                type: string
                example: Doe
    responses:
      '201':
        description: Account created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SuccessResponse'
      '400':
        description: Invalid input
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'
      '409':
        description: Account already exists
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'


/api/v1/auth/login:
  post:
    summary: Log in a user
    tags: [Auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                format: email
                example: user@example.com
              password:
                type: string
                format: password
                example: StrongPassword123!
    responses:
      '200':
        description: User logged in successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SuccessResponse'
      '400':
        description: Invalid input
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'
      '401':
        description: Invalid credentials
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'


/api/v1/auth/refresh:
  post:
    summary: Refresh an access token
    tags: [Auth]
    parameters:
      - in: cookie
        name: refreshToken
        required: true
        schema:
          type: string
        description: Refresh token stored in a cookie
    responses:
      '200':
        description: Access token refreshed successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SuccessResponse'
      '401':
        description: Invalid or expired refresh token
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'

/api/v1/logout:
  post:
    summary: Log out the current user
    tags: [Auth]
    responses:
      '200':
        description: User logged out successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: success
                message:
                  type: string
                  example: User logged out successfully


/api/v1/me:
  get:
    summary: Get the current user's profile
    tags: [Auth]
    security:
      - bearerAuth: []
    responses:
      '200':
        description: User profile retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    user:
                      $ref: '../components/schemas.yaml#/User'
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ErrorResponse'