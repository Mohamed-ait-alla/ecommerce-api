ErrorResponse:
  type: object
  properties:
    success:
      type: boolean
      example: false
    message:
      type: string

User:
  type: object
  properties:
    id:
      type: string
      format: uuid
    firstName:
      type: string
    lastName:
      type: string
    email:
      type: string
      format: email
    role:
      type: string
      example: USER
    createdAt:
      type: string

SuccessResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    message:
      type: string
    data:
      type: object